name: Build & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package SSAID Changer Next APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SSAID-Changer-Next-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Prepare Tag and Release Notes
        id: release_meta
        run: |
          if [ -n "${GITHUB_REF_NAME}" ] && [[ "${GITHUB_REF_NAME}" == v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v1.4.0"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

          python3 -c "
          import sys, re
          tag = '$TAG'.lstrip('v')
          try:
              with open('CHANGELOG.md', 'r', encoding='utf-8') as f:
                  content = f.read()
              pattern = rf'##\s+v?{re.escape(tag)}\b(.*?)(?=\n##\s+|$)'
              m = re.search(pattern, content, re.DOTALL)
              notes = m.group(1).strip() if m else ''
          except Exception:
              notes = ''
          with open('release_notes.md', 'w', encoding='utf-8') as f:
              if notes:
                  f.write(notes + '\n')
              else:
                  f.write('Release $TAG\n')
          "
          cat release_notes.md

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: SSAID Changer Next ${{ steps.release_meta.outputs.tag }}
          body_path: release_notes.md
          generate_release_notes: true
          files: app/build/outputs/apk/release/*.apk
