name: Build & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release SSAID Changer Next APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          : "${RELEASE_KEYSTORE_BASE64:?Release keystore secret is missing}"
          : "${RELEASE_STORE_PASSWORD:?Release password secret is missing}"
          : "${RELEASE_KEY_ALIAS:?Release alias secret is missing}"
          export RELEASE_STORE_FILE="$RUNNER_TEMP/ssaid-release.p12"
          trap 'rm -f "$RELEASE_STORE_FILE"' EXIT
          umask 077
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RELEASE_STORE_FILE"
          ./gradlew testDebugUnitTest lintDebug assembleRelease --stacktrace --no-daemon

      - name: Verify release signature and generate checksum
        env:
          RELEASE_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          : "${RELEASE_CERT_SHA256:?Release certificate fingerprint variable is missing}"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          for apk in app/build/outputs/apk/release/*.apk; do
            "$APKSIGNER" verify --verbose --print-certs "$apk" | tee "$RUNNER_TEMP/apk-certificate.txt"
            ACTUAL="$(sed -n 's/^.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/apk-certificate.txt" | sort -u)"
            test "$ACTUAL" = "$RELEASE_CERT_SHA256"
            (cd "$(dirname "$apk")" && sha256sum "$(basename "$apk")" > "$(basename "$apk").sha256")
          done

      - name: Prepare Tag and Release Notes
        id: release_meta
        run: |
          # Automatically extract version from build.gradle.kts
          APP_VER=$(grep "versionName = " app/build.gradle.kts | head -n 1 | cut -d'"' -f2 | tr -d '\r')
          TAG="v${APP_VER:-1.5.0}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

          # Extract release notes for this tag from CHANGELOG.md
          python3 -c "
          import sys, re
          tag = '$APP_VER'
          try:
              with open('CHANGELOG.md', 'r', encoding='utf-8') as f:
                  content = f.read()
              pattern = rf'##\s+v?{re.escape(tag)}\b(.*?)(?=\n##\s+|$)'
              m = re.search(pattern, content, re.DOTALL)
              notes = m.group(1).strip() if m else ''
          except Exception:
              notes = ''
          with open('release_notes.md', 'w', encoding='utf-8') as f:
              if notes:
                  f.write(notes + '\n')
              else:
                  f.write('Release ' + '$TAG' + '\n')
          "
          cat release_notes.md

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: SSAID Changer Next ${{ steps.release_meta.outputs.tag }}
          body_path: release_notes.md
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/*.apk.sha256
            docs/release-certificate.sha256
