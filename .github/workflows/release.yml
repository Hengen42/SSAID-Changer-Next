name: Build & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package SSAID Changer Next APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Locate and Prepare Release APK
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          fi
          echo "Found APK at: $APK_PATH"
          echo "APK_FILE=$APK_PATH" >> $GITHUB_ENV

          # Determine Tag
          if [ -n "${GITHUB_REF_NAME}" ] && [[ "${GITHUB_REF_NAME}" == v* ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
          else
            TAG_NAME="v1.3.0"
          fi
          echo "TAG_TARGET=$TAG_NAME" >> $GITHUB_ENV

      - name: Extract Release Notes from CHANGELOG.md
        run: |
          python3 -c "
          import sys, re
          tag = sys.argv[1].lstrip('v')
          try:
              with open('CHANGELOG.md', 'r', encoding='utf-8') as f:
                  content = f.read()
              pattern = rf'##\s+v?{re.escape(tag)}\b(.*?)(?=\n##\s+|$)'
              m = re.search(pattern, content, re.DOTALL)
              notes = m.group(1).strip() if m else ''
          except Exception:
              notes = ''
          with open('release_notes.md', 'w', encoding='utf-8') as f:
              if notes:
                  f.write(notes + '\n')
              else:
                  f.write('Release ' + sys.argv[1] + '\n')
          " "${{ env.TAG_TARGET }}"
          cat release_notes.md

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_TARGET }}
          name: SSAID Changer Next ${{ env.TAG_TARGET }}
          body_path: release_notes.md
          generate_release_notes: true
          files: |
            ${{ env.APK_FILE }}
