name: Build & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release SSAID Changer Next APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Prepare Tag and Release Notes
        id: release_meta
        run: |
          # Automatically extract version from build.gradle.kts
          APP_VER=$(grep "versionName = " app/build.gradle.kts | head -n 1 | cut -d'"' -f2 | tr -d '\r')
          TAG="v${APP_VER:-1.5.0}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

          # Extract release notes for this tag from CHANGELOG.md
          python3 -c "
          import sys, re
          tag = '$APP_VER'
          try:
              with open('CHANGELOG.md', 'r', encoding='utf-8') as f:
                  content = f.read()
              pattern = rf'##\s+v?{re.escape(tag)}\b(.*?)(?=\n##\s+|$)'
              m = re.search(pattern, content, re.DOTALL)
              notes = m.group(1).strip() if m else ''
          except Exception:
              notes = ''
          with open('release_notes.md', 'w', encoding='utf-8') as f:
              if notes:
                  f.write(notes + '\n')
              else:
                  f.write('Release ' + '$TAG' + '\n')
          "
          cat release_notes.md

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: SSAID Changer Next ${{ steps.release_meta.outputs.tag }}
          body_path: release_notes.md
          generate_release_notes: true
          files: app/build/outputs/apk/release/*.apk
